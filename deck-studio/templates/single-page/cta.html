<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>CTA</title>
<link rel="stylesheet" href="../../assets/fonts.css">
<link rel="stylesheet" href="../../assets/base.css">
<link rel="stylesheet" id="theme-link" href="../../assets/themes/aurora.css">
<link rel="stylesheet" href="../../assets/animations/animations.css">
<style>
.cta .btn{display:inline-flex;align-items:center;gap:10px;padding:20px 32px;border-radius:999px;background:var(--accent);color:#0b1024;font-weight:700;font-size:20px;box-shadow:var(--shadow-lg);text-decoration:none;border:none;cursor:pointer;transition:transform 160ms ease-out, box-shadow 160ms ease-out}
.cta .btn.outline{background:transparent;color:var(--text-1);border:1.5px solid var(--border-strong)}
/* 焦点环（A3 修复）：键盘可见，对比度足 */
.cta .btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:999px}
.cta .btn.outline:focus-visible{outline-color:var(--text-1)}
/* hover/active（I2 修复）：触屏安全，仅在精确指针设备上触发 */
@media (hover:hover) and (pointer:fine){
  .cta .btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(11,16,36,.18)}
  .cta .btn.outline:hover{background:rgba(0,0,0,.04);transform:none}
}
.cta .btn:active{transform:translateY(0) scale(.98)}
</style>
</head><body class="single">
<div class="deck"><section class="slide is-active center tc cta" data-title="CTA">
  <div style="max-width:900px">
    <p class="kicker">Call to action</p>
    <h1 class="h1 anim-rise-in" data-anim="rise-in" style="font-size:96px">
      <span class="gradient-text">动手做你的</span><br>第一份 html-ppt
    </h1>
    <p class="lede" style="margin:16px auto 30px">复制模板、换上你的内容、按 <b>T</b> 挑一个最对味的主题，讲完还能一键导出 PNG。</p>
    <div class="row" style="justify-content:center" data-block-id="cta-buttons">
      <!-- href="#" 为 template 占位，实际使用时替换为真实目标 -->
      <a class="btn" href="#"><span aria-hidden="true">🚀</span> ./new-deck.sh my-talk</a>
      <a class="btn outline" href="#">查看 SKILL.md</a>
    </div>
    <p class="dim mt-l" style="font-size:14px">键盘： ← → 翻页 · T 主题 · A 动效 · F 全屏 · O 概览 · S 备注</p>
  </div>
</section></div>
<script src="../../assets/runtime.js"></script>
</body></html>
